<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif">
  <!-- Background -->
  <rect width="900" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Lab 31 - Flask OIDC + RBAC Architecture</text>
  <text x="450" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Single Flask process hosting both the RP and the mock Identity Provider</text>

  <!-- Browser box -->
  <rect x="40" y="110" width="150" height="340" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="115" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730a3">Browser</text>
  <text x="115" y="155" text-anchor="middle" font-size="11" fill="#4338ca">(User)</text>

  <!-- Browser content -->
  <rect x="55" y="175" width="120" height="32" rx="5" fill="#ffffff" stroke="#6366f1"/>
  <text x="115" y="196" text-anchor="middle" font-size="11" fill="#1f2937">/  (index)</text>

  <rect x="55" y="215" width="120" height="32" rx="5" fill="#ffffff" stroke="#6366f1"/>
  <text x="115" y="236" text-anchor="middle" font-size="11" fill="#1f2937">/login</text>

  <rect x="55" y="255" width="120" height="32" rx="5" fill="#ffffff" stroke="#6366f1"/>
  <text x="115" y="276" text-anchor="middle" font-size="11" fill="#1f2937">/callback</text>

  <rect x="55" y="295" width="120" height="32" rx="5" fill="#ffffff" stroke="#6366f1"/>
  <text x="115" y="316" text-anchor="middle" font-size="11" fill="#1f2937">/profile</text>

  <rect x="55" y="335" width="120" height="32" rx="5" fill="#ffffff" stroke="#6366f1"/>
  <text x="115" y="356" text-anchor="middle" font-size="11" fill="#1f2937">/dashboard</text>

  <rect x="55" y="375" width="120" height="32" rx="5" fill="#ffffff" stroke="#6366f1"/>
  <text x="115" y="396" text-anchor="middle" font-size="11" fill="#1f2937">/editor</text>

  <rect x="55" y="415" width="120" height="32" rx="5" fill="#ffffff" stroke="#6366f1"/>
  <text x="115" y="436" text-anchor="middle" font-size="11" fill="#1f2937">/admin</text>

  <!-- Load Balancer -->
  <rect x="240" y="240" width="120" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="300" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">Load Balancer</text>
  <text x="300" y="290" text-anchor="middle" font-size="11" fill="#78350f">https://LB_DOMAIN</text>
  <text x="300" y="306" text-anchor="middle" font-size="10" fill="#78350f">proxies port 5000</text>

  <!-- Flask App big box -->
  <rect x="410" y="90" width="450" height="430" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="635" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">Flask App (single process, port 5000)</text>

  <!-- Relying Party block -->
  <rect x="430" y="135" width="410" height="195" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="635" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">Relying Party (app.py)</text>

  <!-- Flask routes inside RP -->
  <rect x="445" y="170" width="180" height="145" rx="5" fill="#f0fdf4" stroke="#10b981"/>
  <text x="535" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">Flask Routes</text>
  <text x="455" y="208" font-size="10" fill="#1f2937">/  /login  /callback</text>
  <text x="455" y="225" font-size="10" fill="#1f2937">/profile  /dashboard</text>
  <text x="455" y="242" font-size="10" fill="#1f2937">/editor (editor|admin)</text>
  <text x="455" y="259" font-size="10" fill="#1f2937">/admin (admin)</text>
  <text x="455" y="276" font-size="10" fill="#1f2937">/forbidden  /logout</text>
  <text x="455" y="296" font-size="10" fill="#6b7280" font-style="italic">decorators from rbac.py</text>

  <!-- OIDC client inside RP -->
  <rect x="635" y="170" width="195" height="145" rx="5" fill="#f0fdf4" stroke="#10b981"/>
  <text x="732" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">OIDC Client (oidc.py)</text>
  <text x="645" y="208" font-size="10" fill="#1f2937">Authlib OAuth registry</text>
  <text x="645" y="225" font-size="10" fill="#1f2937">PyJWKClient (verifies id_token)</text>
  <text x="645" y="242" font-size="10" fill="#1f2937">Discovery metadata loader</text>
  <text x="645" y="259" font-size="10" fill="#1f2937">PKCE state + nonce</text>
  <text x="645" y="276" font-size="10" fill="#1f2937">Server-to-server on localhost</text>
  <text x="645" y="296" font-size="10" fill="#6b7280" font-style="italic">drives the Auth Code flow</text>

  <!-- Mock IdP block -->
  <rect x="430" y="345" width="410" height="160" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="635" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">Mock Identity Provider (mock_idp.py, mounted under /realms)</text>

  <!-- Mock IdP endpoints -->
  <rect x="445" y="380" width="180" height="115" rx="5" fill="#ffedd5" stroke="#ea580c"/>
  <text x="535" y="398" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c2d12">OIDC Endpoints</text>
  <text x="455" y="418" font-size="10" fill="#1f2937">/.well-known/openid-configuration</text>
  <text x="455" y="435" font-size="10" fill="#1f2937">/protocol/openid-connect/auth</text>
  <text x="455" y="452" font-size="10" fill="#1f2937">/protocol/openid-connect/token</text>
  <text x="455" y="469" font-size="10" fill="#1f2937">/protocol/openid-connect/certs</text>
  <text x="455" y="486" font-size="10" fill="#1f2937">/protocol/openid-connect/logout</text>

  <!-- Mock IdP internals -->
  <rect x="635" y="380" width="195" height="115" rx="5" fill="#ffedd5" stroke="#ea580c"/>
  <text x="732" y="398" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c2d12">Internals</text>
  <text x="645" y="418" font-size="10" fill="#1f2937">RSA key generated at import</text>
  <text x="645" y="435" font-size="10" fill="#1f2937">Signs id_token with RS256</text>
  <text x="645" y="452" font-size="10" fill="#1f2937">Seeded users: alice, bob, carol</text>
  <text x="645" y="469" font-size="10" fill="#1f2937">groups claim per user</text>
  <text x="645" y="486" font-size="10" fill="#1f2937">renders user picker HTML</text>

  <!-- Config block -->
  <rect x="410" y="535" width="450" height="0" />
  <text x="635" y="545" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">config.py reads .env and derives every public URL from LB_DOMAIN</text>

  <!-- Arrows: Browser -> LB -->
  <line x1="190" y1="280" x2="240" y2="280" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="215" y="272" text-anchor="middle" font-size="10" fill="#374151">HTTPS</text>

  <!-- Arrows: LB -> Flask App -->
  <line x1="360" y1="280" x2="410" y2="280" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="385" y="272" text-anchor="middle" font-size="10" fill="#374151">:5000</text>

  <!-- Arrow inside Flask: RP -> Mock IdP -->
  <line x1="535" y1="315" x2="535" y2="345" stroke="#059669" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowGreen)"/>
  <text x="555" y="333" font-size="10" fill="#047857">metadata + JWKS via localhost</text>

  <line x1="732" y1="315" x2="732" y2="345" stroke="#059669" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowGreen)"/>
  <text x="710" y="333" font-size="10" fill="#047857">token + userinfo</text>

  <!-- Arrow definitions -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="40" y="475" width="150" height="65" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="115" y="495" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2937">Legend</text>
  <line x1="55" y1="510" x2="80" y2="510" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="90" y="514" font-size="10" fill="#1f2937">HTTPS traffic</text>
  <line x1="55" y1="528" x2="80" y2="528" stroke="#059669" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowGreen)"/>
  <text x="90" y="532" font-size="10" fill="#1f2937">in-process call</text>
</svg>
